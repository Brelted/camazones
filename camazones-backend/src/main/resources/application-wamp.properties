spring.datasource.url=jdbc:mysql://localhost:3306/camazones?useSSL=false&serverTimezone=Africa/Douala&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${WAMP_DB_USER:root}
spring.datasource.password=${WAMP_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/api
