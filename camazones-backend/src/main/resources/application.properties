spring.application.name=camazones-backend
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties],optional:file:camazones-backend/.env[.properties],optional:file:camazones-backend/.env.local[.properties]

# Database Configuration (WAMP MySQL/MariaDB)
spring.datasource.url=${WAMP_DB_URL:jdbc:mysql://localhost:3306/camazones?useSSL=false&serverTimezone=Africa/Douala&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${WAMP_DB_USER:root}
spring.datasource.password=${WAMP_DB_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
camazones.seed.enabled=${CAMAZONES_SEED_ENABLED:true}

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api

# JWT Configuration
# ⚠️  Ne jamais mettre une vraie clé ici ! Utiliser une variable d'environnement en production.
jwt.secret=${JWT_SECRET:local-dev-only-secret-minimum-256bits-camazones-2026}
jwt.expiration=86400000

# Mail Configuration
spring.mail.host=${CAMAZONES_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${CAMAZONES_MAIL_PORT:587}
spring.mail.username=${CAMAZONES_MAIL_USERNAME:}
spring.mail.password=${CAMAZONES_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000
camazones.mail.from=${CAMAZONES_MAIL_FROM:${spring.mail.username}}
camazones.mail.enabled=${CAMAZONES_MAIL_ENABLED:true}

camazones.stripe.secret-key=${STRIPE_SECRET_KEY:}
camazones.stripe.currency=${CAMAZONES_STRIPE_CURRENCY:xaf}
camazones.stripe.api-version=${CAMAZONES_STRIPE_API_VERSION:}
camazones.openai.api-key=${OPENAI_API_KEY:}
camazones.openai.transcription-model=${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
camazones.google.api-key=${GOOGLE_API_KEY:${GEMINI_API_KEY:}}
camazones.google.transcription-model=${GOOGLE_TRANSCRIPTION_MODEL:gemini-1.5-flash}

# Logging
logging.level.root=INFO
logging.level.com.camazones=DEBUG
