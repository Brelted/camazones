spring.application.name=camazones-backend
spring.profiles.active=dev

# Database Configuration (H2 for dev, PostgreSQL for prod)
spring.datasource.url=jdbc:h2:mem:camazones
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api

# JWT Configuration
# ⚠️  Ne jamais mettre une vraie clé ici ! Utiliser une variable d'environnement en production.
jwt.secret=${JWT_SECRET:local-dev-only-secret-minimum-256bits-camazones-2026}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.camazones=DEBUG
